{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | CodeAlpha Store</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>

<header class="navbar">

    <div class="logo">
        CodeAlpha Store
    </div>

    <nav>
        <a href="{% url 'store:home' %}">
            Home
        </a>

        <a href="{% url 'store:cart' %}">
            🛒 Cart
        </a>

        <a href="{% url 'store:login' %}">
            Login
        </a>
    </nav>

</header>


<main class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p>
            Join CodeAlpha Store today.
        </p>

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                required
            >


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                required
            >


            <button
                type="submit"
                class="auth-btn"
            >
                Create Account
            </button>

        </form>


        <p class="auth-link">
            Already have an account?

            <a href="{% url 'store:login' %}">
                Login
            </a>
        </p>

    </div>

</main>

</body>
</html>
