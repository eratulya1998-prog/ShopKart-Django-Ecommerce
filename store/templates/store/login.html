{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | CodeAlpha Store</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>

<body>

<header class="navbar">

    <div class="logo">
        CodeAlpha Store
    </div>

    <nav>

        <a href="{% url 'store:home' %}">
            Home
        </a>

        <a href="{% url 'store:cart' %}">
            🛒 Cart
        </a>

        <a href="{% url 'store:register' %}">
            Register
        </a>

    </nav>

</header>


<main class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p>
            Login to your CodeAlpha Store account.
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                required
            >


            <button
                type="submit"
                class="auth-btn"
            >
                Login
            </button>

        </form>


        <p class="auth-link">

            Don't have an account?

            <a href="{% url 'store:register' %}">
                Create Account
            </a>

        </p>

    </div>

</main>

</body>
</html>
